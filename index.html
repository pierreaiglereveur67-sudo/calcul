<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Calcul Mental Arena</title><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--c1:#6c5ce7;--c2:#00b894;--c3:#fd79a8;--card:#ffffff;--tx:#2d3436}html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#341f97,#6c5ce7 50%,#0984e3);background-attachment:fixed}#app{max-width:820px;margin:auto;padding:18px}h1{text-align:center;font-size:2.2rem;margin:10px 0 4px}.sub{text-align:center;opacity:.85;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:var(--card);color:var(--tx);border-radius:18px;padding:20px;cursor:pointer;box-shadow:0 8px 20px #0003;transition:.2s;text-align:center;border:0;font:inherit}.card:hover{transform:translateY(-5px) rotate(-1deg)}.card .e{font-size:3rem}.card h3{margin:6px 0}.card p{margin:0;font-size:.9rem;opacity:.75}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 18px;background:var(--c2);color:#fff;font-weight:700}button.ghost{background:#ffffff30}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.tbox{height:14px;background:#0004;border-radius:9px;overflow:hidden;margin-bottom:14px}#tb{height:100%;width:100%;background:linear-gradient(90deg,#55efc4,#00b894);transition:width .05s linear}#tb.low{background:linear-gradient(90deg,#ff7675,#d63031)}.q{background:#fff;color:var(--tx);border-radius:20px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(1.6rem,6vw,3rem);font-weight:800;padding:16px;text-align:center;box-shadow:0 8px 20px #0003}.q small{font-size:.9rem;font-weight:400;opacity:.6;margin-top:8px}.n{font-size:clamp(4rem,18vw,8rem);color:var(--c1);animation:pop .3s}#msg{min-height:34px;text-align:center;font-size:1.1rem;font-weight:700;margin:10px 0}.inp{display:flex;gap:8px;justify-content:center}#in{font:inherit;font-size:1.8rem;width:200px;text-align:center;border-radius:14px;border:3px solid #fff;padding:8px;color:var(--tx)}.res{text-align:center;padding:30px 10px}.big{font-size:6rem;animation:pop .6s}.stars{font-size:2.6rem;margin:10px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.field{position:relative;overflow:hidden;height:46vh;min-height:300px;border-radius:20px;background:linear-gradient(#74b9ff,#0984e3 70%,#0652a8);box-shadow:0 8px 20px #0003;margin-bottom:12px}.bub{position:absolute;top:0;padding:14px 16px;border-radius:40px;background:radial-gradient(circle at 30% 30%,#fff,#a29bfe);color:#2d3436;font-weight:800;font-size:1.3rem;white-space:nowrap;box-shadow:0 0 12px #fff8}.boom{animation:boom .4s forwards}.shake{animation:shake .4s}.badge{font-size:.8rem;opacity:.8}#cv{position:fixed;inset:0;pointer-events:none;z-index:9}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@keyframes boom{to{transform:scale(2);opacity:0}}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}#top{max-width:820px;margin:auto;padding:10px 18px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:.9rem}#top button{padding:5px 10px}.goal,.tip,.panel{background:#ffffff22;border-radius:16px;padding:12px 16px;margin:0 0 14px}.tip{background:#ffeaa733;text-align:center}.panel h3,.panel h2{margin:4px 0 8px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;text-align:center}.stats b{display:block;font-size:1.6rem}.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;text-align:center}.badges div{background:#ffffff25;border-radius:12px;padding:8px}.badges small{display:block;opacity:.8;font-size:.7rem}.lock{filter:grayscale(1);opacity:.35}.mrow{margin-bottom:6px}.mrow .tbox{height:10px;margin:2px 0}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fdcb6e;color:#2d3436;padding:12px 20px;border-radius:30px;font-weight:800;z-index:10;animation:pop .4s;box-shadow:0 6px 20px #0005}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:12px auto 0}.k{padding:14px 0;font-size:1.4rem;background:#fff;color:var(--tx);box-shadow:0 3px 0 #0003;touch-action:manipulation;user-select:none;-webkit-user-select:none}.k:active{transform:translateY(2px);box-shadow:none}.kok{grid-column:span 2;background:var(--c2);color:#fff;font-size:1.2rem}.kdel{background:#fab1a0;font-size:1rem}.chb{font-size:1.8rem;padding:18px 34px;border-radius:16px;background:#fff;color:var(--c1);min-width:110px;box-shadow:0 4px 0 #0003}.chb:disabled{opacity:.5}.aid{display:block;text-align:right;font-size:.85rem;margin:-4px 0 8px;opacity:.9;cursor:pointer}.viz{background:#ffffff22;border-radius:14px;padding:10px;margin:8px auto;max-width:520px;text-align:center}.viz:empty{display:none}.vb{display:flex;height:34px;border-radius:8px;overflow:hidden;color:#2d3436;font-weight:700;margin-bottom:6px}.vb i{display:flex;align-items:center;justify-content:center;min-width:44px;font-style:normal}.dots{display:grid;gap:3px;justify-content:center;margin:4px auto}.dots b{width:14px;height:14px;background:#ffeaa7;border-radius:50%}.pyr{display:flex;flex-direction:column;gap:6px;align-items:center}.pyr .r{display:flex;gap:6px}.br{min-width:64px;padding:10px;background:#a29bfe33;border:2px solid var(--c1);border-radius:10px;font-size:1.6rem}.br.cur{background:#ffeaa7;border-color:#e17055}</style></head><body><div id="top"></div><div id="app"></div><canvas id="cv"></canvas><script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,sleep=ms=>new Promise(r=>setTimeout(r,ms));
let W={};try{W=JSON.parse(localStorage.getItem('cm')||'{}')}catch(e){}
const save=(k,v)=>{W[k]=v;try{localStorage.setItem('cm',JSON.stringify(W))}catch(e){}};
const MODES=[
{n:'Enchaîne-les !',e:'🔥',d:'5 calculs justes d\'affilée. Une erreur ou le temps écoulé : on recommence !'},
{n:'Défilé de nombres',e:'🎞️',d:'Les nombres défilent (1 s chacun). Donne la somme !'},
{n:'Suite d\'opérations',e:'🧮',d:'Enchaîne + − × ÷ de gauche à droite.'},
{n:'Pluie de bulles',e:'🫧',d:'Éclate les calculs avant qu\'ils touchent le sol. 3 vies !'},
{n:'Contre-la-montre',e:'⏱️',d:'60 secondes : fais un maximum de bonnes réponses !'},
{n:'Nombre manquant',e:'🕵️',d:'7 × ? = 56 : retrouve le nombre caché.'},
{n:'Estimation',e:'🎯',d:'Pas besoin d\'être exact : approche-toi du résultat !'},
{n:'Vrai ou Faux ?',e:'⚡',d:'8 × 7 = 54 ? Réponds en 3 secondes !'},
{n:'Le Bon Compte',e:'🧩',d:'Atteins le nombre cible avec 3 ou 4 nombres : + − ×.'},
{n:'Pyramide d\'additions',e:'🧱',d:'Chaque brique est la somme des deux du dessous.'},
{n:'Balance',e:'⚖️',d:'Compare deux calculs : < , > ou = ?'},
{n:'Complément 100 / 1000',e:'🎯',d:'63 + ? = 100 : trouve le complément au plus vite.'}];
const LV=[['Moyen','🟢'],['Difficile','🟠'],['Dieu','⚡'],['Adaptatif','🧠']],CH=[7,10];
let tok=0,tm=null,S={};const render=h=>$('#app').innerHTML=h;const stopT=()=>{clearInterval(tm);tm=null};
// ---------- Aides : niveau effectif, adaptation, saisie
const L=()=>S.l==3?Math.min(2,Math.floor(S.ad.lv)):S.l,BL=()=>S.l==3?1:S.l,TM=t=>S.l==3?t*S.ad.tm:t;
function adapt(g,f){if(S.l!=3)return;const a=S.ad;if(g&&f){a.f++;a.b=0;if(a.f>=3){a.f=0;a.lv=Math.min(2.99,a.lv+.5);a.tm=Math.max(.6,a.tm*.9);S.note='🧠 Tu files : nombres plus grands, moins de temps.'}}else{a.f=0;a.b++;if(a.b>=2){a.b=0;a.lv=Math.max(0,a.lv-.5);a.tm=Math.min(1.6,a.tm*1.2);S.note='🧠 On souffle : calculs simplifiés, plus de temps.'}}ttl()}
function ttl(){const e=$('#ttl');if(e&&S.m!=null)e.textContent=MODES[S.m].n+' · '+LV[S.l][0]+(S.l==3?' ('+LV[L()][1]+LV[L()][0]+')':'')}
const msg=(t,c)=>{const e=$('#msg');if(e){e.textContent=(t?t+' ':'')+(S.note||'');e.className=c||''}S.note=''};
const val=()=>{const i=$('#in');if(!i)return null;const s=i.value.replace(/[−–]/g,'-').trim();return /^-?\d+$/.test(s)?+s:null};
const pad=ops=>`<div class="pad">${['7','8','9','⌫','4','5','6','−','1','2','3',ops?'+':'','0',ops?'×':'','OK'].map(k=>k?`<button class="k${k=='OK'?' kok':k=='⌫'?' kdel':''}" aria-label="${k=='⌫'?'Effacer':k=='OK'?'Valider':k}" onmousedown="event.preventDefault()" onclick="kp('${k}')">${k=='OK'?'Valider':k=='⌫'?'⌫ Effacer':k}</button>`:'<span></span>').join('')}</div>`;
function kp(k){const i=$('#in');if(!i||i.disabled)return;if(k=='OK'){S.sub&&S.sub();return}if(k=='⌫'){i.value=i.value.slice(0,-1);return}if(i.value.length>14)return;i.value+=k}
const inputHTML=(dis)=>`<div class="inp"><input id="in" type="text" inputmode="none" autocomplete="off" ${dis?'disabled':''}><button id="ok">OK</button></div>`;
// ---------- Génération et diagnostic
const mq=(x,o,y)=>({t:o=='²'?`${x}²`:`${x} ${o} ${y}`,a:o=='+'?x+y:o=='−'?x-y:o=='²'?x*x:x*y,x,o,y});
function gen1(l){let a,t;if(l==0){t=R(0,2);if(t==0)return mq(R(10,60),'+',R(10,40));if(t==1){a=R(30,90);return mq(a,'−',R(10,a-1))}return mq(R(2,9),'×',R(2,9))}
if(l==1){t=R(0,3);if(t==0)return mq(R(100,500),'+',R(20,99));if(t==1)return mq(R(100,900),'−',R(20,99));if(t==2)return mq(R(6,12),'×',R(6,12));return mq(R(11,19),'×',R(3,9))}
t=R(0,3);if(t==0)return mq(R(12,99),'×',R(3,9));if(t==1)return mq(R(11,25),'×',R(11,25));if(t==2)return mq(R(500,999),'−',R(100,499));return mq(R(11,30),'²')}
function diag(q,v){const{x,y,o,a}=q;
if(o=='+'){if(v===a-10&&x%10+y%10>=10)return`Proche ! Tu as oublié la retenue des unités (${x%10} + ${y%10} = ${x%10+y%10}).`;if(Math.abs(v-a)==10)return'Proche ! Vérifie la retenue sur les dizaines.';if(v===x-y)return'Tu as soustrait au lieu d\'additionner.'}
if(o=='−'){const tn=(x-x%10)-(y-y%10)+Math.abs(x%10-y%10);if(v===x+y)return'Tu as additionné au lieu de soustraire.';if(x%10<y%10&&v===tn)return'Attention au sens de la soustraction : si les unités du haut sont plus petites, on emprunte une dizaine, on ne les inverse pas.';if(Math.abs(v-a)==10)return'Proche ! Attention à l\'emprunt de la dizaine.'}
if(o=='×'){if([a-x,a-y,a+x,a+y].includes(v))return`Proche ! ${x}×${y} = ${x}×${y-1} + ${x} = ${x*(y-1)} + ${x}.`;if(v===x+y)return'Tu as additionné au lieu de multiplier.';if(v*10===a||v===a*10)return'Vérifie les zéros !'}
if(o=='²'){if(v===2*x)return`Un carré, c'est ${x} × ${x}, pas ${x} × 2.`;if(v%x==0&&Math.abs(v/x-x)==1)return`Proche ! ${x}² = ${x} × ${x}, pas ${x} × ${v/x}.`}
return''}
function astuce(q){const{x,y,o}=q,r=(10-y%10)%10;
if(o=='+')return y%10>=5?`pour ${x}+${y}, fais ${x}+${y+r}−${r}`:y%10?`pour ${x}+${y}, fais ${x}+${y-y%10}+${y%10}`:`additionne d'abord les dizaines`;
if(o=='−')return y%10>=5?`pour ${x}−${y}, fais ${x}−${y+r}+${r}`:y%10?`pour ${x}−${y}, fais ${x}−${y-y%10}−${y%10}`:`soustrais d'abord les dizaines`;
if(o=='×'){const p=Math.max(x,y),s=Math.min(x,y);return p>10?`pour ${x}×${y}, fais ${s}×${p-p%10} + ${s}×${p%10}`:`pour ${x}×${y}, fais ${x}×${y-1} + ${x}`}
return x%10==5?`pour ${x}², fais ${(x-5)/10}×${(x-5)/10+1} puis écris 25`:`pour ${x}², fais ${x}×${x-x%10} + ${x}×${x%10}`}
const dsp=q=>q.disp||(q.t.includes('?')?q.t.replace('?',q.a):q.t+' = '+q.a);
const fb=(q,v)=>(v===null?'⏰ Temps écoulé ! '+(q.o?'💡 Astuce : '+astuce(q)+' → ':''):'❌ '+(q.o?diag(q,v)+' ':''))+(q.hint?q.hint+' ':'')+dsp(q);
// ---------- Aide visuelle
const dec=n=>(''+n).split('').map((d,i,a)=>d*10**(a.length-1-i)).filter(Boolean).join(' + ');
function viz(q){const{x,y,o}=q;let h;
if(o=='+')h=`<div class="vb"><i style="flex:${x};background:#74b9ff">${x}</i><i style="flex:${y};background:#55efc4">${y}</i></div><small>${x} = ${dec(x)} · ${y} = ${dec(y)}<br>Additionne dizaines avec dizaines, unités avec unités</small>`;
else if(o=='−')h=`<div class="vb"><i style="flex:${x-y};background:#74b9ff">${x-y}</i><i style="flex:${y};background:#ff7675">−${y}</i></div><small>${x} = ${x-y} + ${y}</small>`;
else if(o=='×'&&x<=12&&y<=12)h=`<div class="dots" style="grid-template-columns:repeat(${y},14px)">${'<b></b>'.repeat(x*y)}</div><small>${x} lignes de ${y}</small>`;
else if(o=='×'){const p=Math.max(x,y),s=Math.min(x,y);h=`<small>${x} × ${y} = ${s}×${p-p%10} + ${s}×${p%10} = ${s*(p-p%10)} + ${s*(p%10)}</small>`}
else h=`<small>${x}² = ${x}×${x-x%10} + ${x}×${x%10} = ${x*(x-x%10)} + ${x*(x%10)}</small>`;
return h}
const aid=()=>{const c=$('#aid');return c&&c.checked};
const vz=(q,f)=>{const e=$('#viz');if(e)e.innerHTML=q&&q.o&&(f||aid())?viz(q):''};
// ---------- Menu
const REC=[3,4];
function menu(){tok++;stopT();S={};render(`<h1>🧠 Calcul Mental Arena</h1><div class="sub">Choisis ton défi !</div>${goalBar()}${tipBox()}<div class="row" style="margin-bottom:14px"><button onclick="lessons()">🎓 Leçons &amp; astuces</button></div><div class="grid">${MODES.map((m,i)=>`<button class="card" onclick="levels(${i})"><div class="e">${m.e}</div><h3>${m.n}</h3><p>${m.d}</p></button>`).join('')}</div>`)}
function levels(m){tok++;stopT();S={};render(`<div class="bar"><button class="ghost" onclick="menu()">← Menu</button></div><h1>${MODES[m].e} ${MODES[m].n}</h1><div class="sub">${MODES[m].d}</div><div class="grid">${LV.map((l,i)=>`<button class="card" onclick="start(${m},${i})"><div class="e">${l[1]}</div><h3>${l[0]}</h3><p class="badge">${i==3?'Difficulté et temps s\'ajustent à toi · ':''}${REC.includes(m)?'🏆 Record : ':'🏆 Victoires : '}${W['m'+(m+1)+'-'+i]||0}</p></button>`).join('')}</div>`)}
function start(m,l){tok++;stopT();S={m,l,ad:{lv:.5,f:0,b:0,tm:1}};const ch=CH.includes(m);
render(`<div class="bar"><button class="ghost" onclick="levels(${m})">← Quitter</button><b id="ttl"></b><span id="sc"></span></div><label class="aid"><input type="checkbox" id="aid" ${l==0||l==3?'checked':''}> 👁️ Aide visuelle</label><div class="tbox" ${m==3?'style="display:none"':''}><div id="tb"></div></div>${m==3?'<div class="field" id="q"></div>':'<div class="q" id="q"></div>'}<div id="viz"></div><div id="msg"></div>${ch?'<div class="row" id="ch"></div>':inputHTML(![3,4].includes(m))+pad(m==8)}`);
ttl();if(!ch){const go=()=>S.sub&&S.sub();$('#ok').onclick=go;$('#in').onkeydown=e=>{if(e.key=='Enter')go()}}
[m1,m2,m3,m4,m5,m6,m7,m8,m9,m10,m11,m12][m](l)}
function startT(s,cb){stopT();const t0=Date.now(),b=$('#tb');tm=setInterval(()=>{const f=1-(Date.now()-t0)/(s*1000);b.style.width=Math.max(f,0)*100+'%';b.className=f<.3?'low':'';if(f<=0){stopT();cb()}},50)}
function ask(t,raw){return new Promise(r=>{const i=$('#in');i.value='';i.disabled=false;i.focus();const t0=Date.now();S.el=Infinity;S.sub=()=>{const v=raw?i.value.trim():val();if(v===''||v===null)return;stopT();S.sub=null;S.el=(Date.now()-t0)/1000;r(v)};startT(t,()=>{S.sub=null;r(null)})})}
function pick(o,T){return new Promise(r=>{const c=$('#ch'),t0=Date.now();S.el=Infinity;c.innerHTML='';const lock=()=>c.querySelectorAll('button').forEach(z=>z.disabled=true);o.forEach(x=>{const b=document.createElement('button');b.className='chb';b.textContent=x;b.onclick=()=>{if(!S.pk)return;stopT();S.pk=0;S.el=(Date.now()-t0)/1000;lock();r(x)};c.appendChild(b)});S.pk=1;startT(T,()=>{S.pk=0;lock();r(null)})})}
const resetT=()=>{stopT();const b=$('#tb');if(b){b.style.width='100%';b.className=''}};
// ---------- MODE 1 : Enchaîne-les
async function m1(l){const my=tok;let st=0,tries=0;while(st<5){const q=gen1(L()),T=TM([15,12,10][L()]);$('#q').textContent=q.t+' = ?';vz(q);$('#sc').textContent='●'.repeat(st)+'○'.repeat(5-st);const v=await ask(T);if(my!=tok)return;tries++;const g=v===q.a;adapt(g,S.el<T*.5);if(g){st++;rec(1);msg(cheer(1));confetti(25);vz();if(st<5)await sleep(500)}else{rec(0);if(st>0)$('#q').classList.add('shake');vz(q,1);msg(fb(q,v)+(st?' — retour à 0':''));st=0;await sleep(2800);$('#q').classList.remove('shake')}msg('')}
$('#sc').textContent='●●●●●';save('m1-'+l,(W['m1-'+l]||0)+1);end('🏆','SÉRIE PARFAITE !',`5 d'affilée en ${tries} essai${tries>1?'s':''}`,tries<=5?3:tries<=8?2:1)}
// ---------- Moteur de manches (modes 2, 3, 6, 7, 8, 9, 11, 12)
async function rounds(l,mk,pres,N=5){const my=tok;let ok=0;
for(let i=0;i<N;i++){$('#sc').textContent=`Manche ${i+1}/${N} · ✅ ${ok}`;const q=mk(L());ttl();msg('');vz();await pres(q,my);if(my!=tok)return;const T=TM(q.time);vz(q);
const v=await(q.ch?pick(q.ch,T):ask(T,q.raw));if(my!=tok)return;const ii=$('#in');if(ii)ii.disabled=true;
const g=v!==null&&(q.chk?q.chk(v):typeof q.a=='number'?Math.abs(v-q.a)<=(q.tol||0):v===q.a);rec(g);adapt(g,S.el<T*.5);
if(g){ok++;msg(cheer(1)+(q.tol&&v!==q.a?' (exact : '+q.a+')':''));confetti(60)}else{vz(q,1);msg(fb(q,v))}
resetT();await sleep(g?1200:2800);msg('')}
const k='m'+(S.m+1)+'-'+l;if(ok==N)save(k,(W[k]||0)+1);
end(ok==N?'🏆':ok>=N*.6?'👏':'💪',ok==N?'SANS FAUTE !':'Fin de partie',`Score : ${ok} / ${N}`,ok==N?3:ok>=N*.8?2:ok>=N*.6?1:0)}
function mk2(l){const n=[R(3,4),R(5,6),7][l],[lo,hi]=[[2,20],[5,50],[10,99]][l],A=[];for(let i=0;i<n;i++)A.push(R(lo,hi));return{A,t:A.join(' + '),a:A.reduce((x,y)=>x+y),time:[10,9,8][l]}}

{e:'💯',n:'Compléments à 100',tip:'Pour compléter à 100 : les unités se complètent à 10, les dizaines à 9.',ex:{t:'63 + ? = 100',st:['Unités : 3 → il manque 7 pour faire 10','Dizaines : 6 → il manque 3 pour faire 9','Complément : 3 dizaines et 7 unités = 37 ✅']},g(){let n;do n=R(1,99);while(n%10==0);return{t:`${n} + ? = 100`,a:100-n,hint:`unités +${10-n%10}, dizaines +${9-(n/10|0)}`}}}];
const lh=(i,s,x='')=>`<div class="bar"><button class="ghost" onclick="lessons()">← Leçons</button><b>${LES[i].e} ${LES[i].n}</b><span>${x||'Étape '+s+'/3'}</span></div>`;
function lessons(){tok++;stopT();S={};render(`<div class="bar"><button class="ghost" onclick="menu()">← Menu</button><b>🎓 Leçons</b><span></span></div><div class="sub">Astuce → exemple guidé → 5 exercices</div><div class="grid">${LES.map((x,i)=>`<button class="card" onclick="lesson(${i})"><div class="e">${x.e}</div><h3>${x.n}</h3><p>${ST.ls[i]?'✅ Validée':'3 étapes · 5 exercices'}</p></button>`).join('')}</div>`)}
function lesson(i){tok++;stopT();S={};render(lh(i,1)+`<div class="panel"><h2>💡 L'astuce</h2><p style="font-size:1.15rem;line-height:1.5">${LES[i].tip}</p></div><div class="row"><button onclick="lex(${i},0)">Voir un exemple guidé</button></div>`)}
function lex(i,k){tok++;const e=LES[i].ex;render(lh(i,2)+`<div class="panel"><h2>👀 Exemple : ${e.t}</h2>${e.st.slice(0,k+1).map((x,j)=>`<div class="tip" style="text-align:left">${j+1}. ${x}</div>`).join('')}</div><div class="row">${k<e.st.length-1?`<button onclick="lex(${i},${k+1})">Étape suivante</button>`:`<button onclick="lx(${i},0,0)">À toi : 5 exercices</button>`}</div>`)}
function lx(i,n,ok){tok++;const my=tok;S={};
if(n>=5){ST.xp+=ok*6;if(ok>=3){ST.ls[i]=1;unlock('lec')}persist();render(`<div class="res"><div class="big">🎓</div><h2>${ok>=3?'Leçon validée !':'Encore un petit effort !'}</h2><p>${ok} / 5 exercices réussis · +${ok*6} XP</p><div class="row"><button onclick="lx(${i},0,0)">🔄 Refaire</button><button class="ghost" onclick="lessons()">Leçons</button><button class="ghost" onclick="menu()">Menu</button></div></div>`);if(ok>=3)confetti(120);return}
const q=LES[i].g();render(lh(i,3,`Exercice ${n+1}/5 · ✅ ${ok}`)+`<div class="q">${q.t}${q.t.includes('?')?'':' = ?'}</div><div id="viz"></div><div id="msg"></div>${inputHTML(0)}${pad()}`);
const inp=$('#in');inp.focus();let done=0;S.sub=()=>{const v=val();if(v===null||done)return;done=1;inp.disabled=true;const g=v===q.a;if(g){msg(cheer(1));confetti(20)}else{msg('❌ Pense à l\'astuce : '+q.hint+' → '+q.a);vz(q,1)}setTimeout(()=>{if(my==tok)lx(i,n+1,ok+(g?1:0))},g?800:3000)};
$('#ok').onclick=()=>S.sub&&S.sub();inp.onkeydown=e=>{if(e.key=='Enter')S.sub&&S.sub()}}
menu();</script></body></html>
